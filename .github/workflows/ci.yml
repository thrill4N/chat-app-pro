name: CI

# Runs on every push and every PR, so a PR's checks reflect exactly what
# would land on the target branch if merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # No test suite yet (see Day 6+ backlog) -- this at least catches
      # syntax errors and bad imports across every backend source file
      # before they reach a PR.
      - name: Syntax-check all source files
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx eslint .

      - name: Build
        run: npm run build
        env:
          # A placeholder is fine here: the build only needs the key to be
          # *present* to compile Clerk's provider correctly. The real key
          # is injected at deploy time, never checked into the repo.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder_for_ci
